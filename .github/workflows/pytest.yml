name: Pytest
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      # System deps (platform-specific)
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libcairo2-dev \
            libgirepository1.0-dev \
            gir1.2-gst-plugins-base-1.0

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo gobject-introspection

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: |
          # gobject-introspection wheels on Windows bundle their own libs;
          # if your build needs the native libs, swap this for a vcpkg/msys2 step.
          echo "No extra system packages required (using wheel-bundled libs)"

      # Checkout & toolchain
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.19"
          cache-local-path: ${{ github.workspace }}/cache/dev/uv

      - name: Prepare locked dependencies and avatar assets (online)
        run: python scripts/dev.py setup

      - name: Run tests (offline)
        run: python scripts/dev.py test
